name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies (Ninja & SDK Tools)
      run: |
        sudo apt-get update && sudo apt-get install -y ninja-build curl unzip tar pkg-config python3
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13599879" "platforms;android-33" "cmake;3.22.1"

    - name: Build LuaJIT and Android Dependencies
      run: |
        chmod +x build_luajit_android.sh
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.13599879
        ./build_luajit_android.sh || true

    - name: Unzip and Deep-Clean Vcpkg Manifest Flags
      run: |
        unzip -q android.zip
        python3 -c '
        import os
        for root, dirs, files in os.walk("android"):
            for file in files:
                filepath = os.path.join(root, file)
                try:
                    with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                        content = f.read()
                    
                    if "VCPKG_MANIFEST_INSTALL" in content:
                        # Reemplazamos cualquier variante de ON por OFF
                        new_content = content.replace("VCPKG_MANIFEST_INSTALL=ON", "VCPKG_MANIFEST_INSTALL=OFF")
                        new_content = new_content.replace("VCPKG_MANIFEST_INSTALL = ON", "VCPKG_MANIFEST_INSTALL=OFF")
                        
                        # Si persiste como línea independiente, la filtramos
                        lines = new_content.splitlines()
                        filtered_lines = [l for l in lines if "VCPKG_MANIFEST_INSTALL" not in l or "OFF" in l]
                        final_content = "\n".join(filtered_lines)
                        
                        with open(filepath, "w", encoding="utf-8") as f:
                            f.write(final_content)
                        print(f"Deep-cleaned vcpkg flags in: {filepath}")
                except Exception:
                    pass
        '

    - name: Build Android APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
