name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Java JDK
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Install dependencies (Ninja & SDK Tools)
      run: |
        sudo apt-get update && sudo apt-get install -y ninja-build curl unzip tar pkg-config python3
        export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses || true
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.13599879" "platforms;android-33" "cmake;3.22.1"

    - name: Build LuaJIT and Android Dependencies
      run: |
        chmod +x build_luajit_android.sh
        export ANDROID_NDK_HOME=/usr/local/lib/android/sdk/ndk/29.0.13599879
        ./build_luajit_android.sh || true

    - name: Unzip and Sanitize CMake Arguments in Gradle
      run: |
        unzip -q android.zip
        python3 -c '
        import os, re
        target_file = "android/app/build.gradle"
        if os.path.exists(target_file):
            with open(target_file, "r", encoding="utf-8", errors="ignore") as f:
                content = f.read()
            
            # Función para filtrar los argumentos de CMake y remover cualquier rastro de VCPKG
            def sanitize_arguments(match):
                line = match.group(0)
                # Dividimos por comas para aislar cada argumento
                parts = line.split(",")
                clean_parts = [p for p in parts if "VCPKG" not in p.upper()]
                return ",".join(clean_parts)

            # Aplicamos la limpieza en las líneas de argumentos de CMake
            content = re.sub(r"arguments\s+.*", sanitize_arguments, content)
            
            with open(target_file, "w", encoding="utf-8") as f:
                f.write(content)
            print("Successfully sanitized CMake arguments in android/app/build.gradle")
        else:
            print("Warning: android/app/build.gradle not found!")
        '

    - name: Build Android APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew clean assembleDebug -Pandroid.injected.build.model.only=false

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: android/app/build/outputs/apk/debug/app-debug.apk
